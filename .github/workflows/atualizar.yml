name: Atualizar dados e publicar

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 18h30 em Brasília, dias úteis
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar dados novos
        if: github.event_name != 'push'
        run: python3 scripts/atualizar.py site
      - name: Salvar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Atualiza dados de mercado"
          git push || (git pull --rebase -X theirs && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    # só a publicação espera na fila; baixar dados não trava a publicação de mudanças no app
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
