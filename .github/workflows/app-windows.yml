name: Gerar app para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/app-windows.yml"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publicar o instalador nas Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: Painel Investimentos para Windows (versão ${{ github.run_number }})
          body: |
            Baixe **Painel-Investimentos-Setup.exe** abaixo e execute.
            Na primeira vez o Windows pode mostrar "O Windows protegeu o computador": clique em **Mais informações** e depois em **Executar assim mesmo**.
            O app abre o site https://davicosban.github.io/Investimentos/ numa janela própria; dados e visual se atualizam sozinhos.
          files: desktop/dist/Painel-Investimentos-Setup.exe
          make_latest: true
