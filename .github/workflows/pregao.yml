name: Cotações a cada 15 min (pregão)

# O agendamento do GitHub atrasa ou pula horários curtos. Por isso um único disparo
# abre uma rodada longa que atualiza as cotações a cada 15 minutos sozinha.
# O app lê os dados direto do repositório (raw.githubusercontent.com), sem republicar o site.
on:
  schedule:
    - cron: "0 13 * * 1-5"    # 10h em Brasília
    - cron: "7 15 * * 1-5"    # reserva, caso o disparo das 10h não aconteça
    - cron: "0 19 * * 1-5"    # 16h em Brasília (substitui a rodada anterior, que tem limite de 6 h)
    - cron: "40 20 * * 1-5"   # reserva para a rodada completa das 18h30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pregao
  cancel-in-progress: true

jobs:
  cotacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar a cada 15 minutos até 18h (Brasília)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          inicio=$(date +%s)
          while :; do
            hora=$(TZ=America/Sao_Paulo date +%H%M)
            if [ "$hora" -ge 1815 ] || [ $(( $(date +%s) - inicio )) -gt 20400 ]; then echo "Fim do pregão"; break; fi
            git pull -q --rebase -X theirs origin main || true
            python3 scripts/atualizar.py site --rapido || echo "rodada falhou, tento de novo em 15 min"
            git add site/br.json site/us.json site/asof.json site/macro.json site/hist.json site/intraday.json site/index.html
            git diff --cached --quiet || git commit -q -m "Cotações $(TZ=America/Sao_Paulo date +%H:%M)"
            git push -q || (git pull -q --rebase -X theirs origin main && git push -q) || echo "push falhou"
            sleep 900
          done
      - name: Rodada completa às 18h30 (Brasília), com histórico
        if: success() || failure()
        run: |
          agora=$(TZ=America/Sao_Paulo date +%H%M)
          if [ "$agora" -lt 1815 ]; then echo "Ainda não é fim do pregão"; exit 0; fi
          if [ "$agora" -gt 2100 ]; then echo "Tarde demais para a rodada do dia"; exit 0; fi
          alvo=$(TZ=America/Sao_Paulo date -d "18:30" +%s)
          espera=$(( alvo - $(date +%s) ))
          [ "$espera" -gt 0 ] && sleep "$espera"
          git pull -q --rebase -X theirs origin main || true
          python3 scripts/atualizar.py site
          git add site
          git diff --cached --quiet || git commit -q -m "Atualiza dados de mercado (fechamento)"
          git push -q || (git pull -q --rebase -X theirs origin main && git push -q)
